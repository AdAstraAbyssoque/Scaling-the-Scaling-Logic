template: |-
  # Role: Validator {validator_id}

  Use English for analysis and feedback; if you propose edits, list them in clear English. Review this problem as an experienced problem designer, focusing on completeness and innovation for {focus}.

  Focus area: {focus}

  ## Artifact to evaluate
  {artifact_section}

  ## Review checklist
  - You may use `read_text` to load the JSON artifact (simple and efficient), or `file_agent` (usually unnecessary), to confirm the statement is self-consistent in narrative, givens, and question.
  - Check that `solution.final_answer` matches the reasoning steps; if there is a gap, list it under `blocking_issues`.
  - Evaluate whether the innovation is real and clearly different from the baseline; if still similar, propose specific edits.
  - If parsing is difficult or external facts are needed, note it in the log and suggest additions.

  {schema_section}

  {_stop}

  Treat `blocking_issues` as the canonical list that forces revisions.
schema:
  title: Output schema
  body: |-
    {
      "validator_id": "__VALIDATOR_ID__",
      "verdict": "pass" | "revise",
      "blocking_issues": ["<string>", "..."],
      "warnings": ["<string>", "..."],
      "strengths": ["<string>", "..."],
      "suggested_edits": "<string>"
    }
stop_hint: Review complete
